add_newline = true
command_timeout = 1000
palette = "catppuccin_macchiato"

# Format: user → dir → git → languages → package → duration → prompt
format = """$username$directory$git_branch$git_status$git_metrics$nodejs$python$package$aws$cmd_duration$line_break$character"""

# --- Prompt Character --------------------------------------------------------
[character]
success_symbol = "[➜](bold mauve)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold yellow)"

# --- User --------------------------------------------------------------------
[username]
style_user = "bold green"
format = "[$user]($style) in "
show_always = false   # Only shows in SSH sessions or when user is different

# --- Directory ---------------------------------------------------------------
[directory]
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
style = "bold blue"
read_only = " 🔒"
home_symbol = " 🏠"

# --- Git Branch --------------------------------------------------------------
[git_branch]
symbol = "🌱 "
style = "bold lavender"
truncation_length = 25
truncation_symbol = "…"
format = "on [$symbol$branch(:$remote_branch)]($style) "

# --- Git Status (Enhanced) ---------------------------------------------------
[git_status]
style = "yellow"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
modified = "✏️"
staged = "[✓](green)"
stashed = "📥"
untracked = ""
renamed = "➜"
deleted = "✗"
conflicted = "💥"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

# --- Git Metrics (My suggestion: shows +/- lines changed) --------------------
[git_metrics]
disabled = false
added_style = "bold green"
deleted_style = "bold red"
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"

# --- Node.js -----------------------------------------------------------------
[nodejs]
symbol = "⬢ "
style = "bold green"
format = "via [$symbol($version )]($style)"
detect_extensions = ["js", "mjs", "cjs", "ts", "tsx"]

# --- Python ------------------------------------------------------------------
[python]
symbol = " "
style = "bold yellow"
format = 'via [${symbol}(${version} )(\($virtualenv\) )]($style)'

# --- Package Version ---------------------------------------------------------
[package]
symbol = "📦 "
style = "bold peach"
format = "is [$symbol$version]($style) "

# --- AWS (if you use it) -----------------------------------------------------
[aws]
symbol = "☁️ "
style = "bold yellow"
format = "on [$symbol$profile(\\($region\\))]($style) "
disabled = true   # Enable with `disabled = false` when needed

# --- Command Duration --------------------------------------------------------
[cmd_duration]
min_time = 2000
format = "⏱ [$duration]($style) "
style = "subtext0"
show_milliseconds = false

# --- My Suggestions: Extra Useful Modules ------------------------------------

# Show current time on right side (helps track when commands ran)
[time]
disabled = false
format = "[$time]($style) "
style = "subtext0"
time_format = "%H:%M"

# Battery indicator (laptop-friendly)
[battery]
disabled = false
full_symbol = "🔋"
charging_symbol = "🔌"
discharging_symbol = "🔋"
[[battery.display]]
threshold = 20
style = "bold red"
[[battery.display]]
threshold = 50
style = "bold yellow"

# Memory usage (shows when usage is high)
[memory_usage]
disabled = false
threshold = 75
symbol = "🧠 "
style = "bold red"
format = "$symbol[${ram_pct}]($style) "

# --- Catppuccin Macchiato Palette --------------------------------------------
[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo  = "#f0c6c6"
pink      = "#f5bde6"
mauve     = "#c6a0f6"
red       = "#ed8796"
maroon    = "#ee99a0"
peach     = "#f5a97f"
yellow    = "#eed49f"
green     = "#a6da95"
teal      = "#8bd5ca"
sky       = "#91d7e3"
sapphire  = "#7dc4e4"
blue      = "#8aadf4"
lavender  = "#b7bdf8"
text      = "#cad3f5"
subtext0  = "#a5adcb"
