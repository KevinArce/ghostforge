# Ghostforge Starship prompt — colourful, two-line, Nerd Font icons.
# Requires a Nerd Font (the installer ships JetBrains Mono Nerd Font).
#
# Layout — everything on line 1, prompt character alone on line 2:
#     ~/Projects/app  main   20.20.0 󰏗 pnpm  1.2.3  3s  127 󰁹 43%  16:17
#   ◎
#
# Colours are ANSI palette *names* only (blue, purple, cyan…), never hex, so the
# prompt follows the terminal theme: Catppuccin Mocha in dark mode, Latte in light.
# One hue per slot: blue = where, purple = what (branch, package version),
# green = runtime, cyan = package manager, yellow = attention, red = broken.
#
# Verify a change with tests/test_prompt.sh — it renders the prompt against
# throwaway repos and checks every segment.
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
continuation_prompt = "[▸▹ ](dimmed white)"

format = """
$os\
$username\
$hostname\
$localip\
$sudo\
$directory\
$git_branch\
$git_commit\
$git_state\
${custom.git_clean}\
$git_status\
$git_metrics\
$nodejs\
$bun\
$deno\
${custom.pnpm}\
${custom.yarn}\
${custom.npm}\
$package\
$python\
$golang\
$rust\
$ruby\
$java\
$lua\
$swift\
$php\
$kotlin\
$dart\
$docker_context\
$terraform\
$gcloud\
$aws\
$cmd_duration\
$status\
$battery\
$time\
$line_break\
$jobs\
$character"""

# --- Frame -------------------------------------------------------------------

[character]
format = "$symbol "
success_symbol = "[◎](bold bright-yellow)"
error_symbol = "[○](bold red)"
vimcmd_symbol = "[■](bold green)"
# not supported in zsh
vimcmd_replace_one_symbol = "◌"
vimcmd_replace_symbol = "□"
vimcmd_visual_symbol = "▼"

[os]
disabled = false
format = "[$symbol]($style)"
style = "white"

[os.symbols]
Macos = " "
Linux = " "

[username]
style_user = "bold bright-yellow"
style_root = "bold red"
format = "[ $user]($style) "
disabled = false
show_always = false

[hostname]
ssh_symbol = " "
format = "[$ssh_symbol$hostname]($style) "
style = "bold green"

[localip]
ssh_only = true
format = " [ $localipv4](bold purple)"
disabled = false

[sudo]
format = " [$symbol]($style)"
style = "bold red"
symbol = ""
disabled = false

[directory]
format = '[ ](bold blue)[$path]($style)[$read_only]($read_only_style)'
repo_root_format = '[ ](bold blue)[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)'
style = "bold blue"
before_repo_root_style = "blue"
repo_root_style = "bold blue"
home_symbol = "~"
truncation_length = 2
truncation_symbol = ""
read_only = " "
read_only_style = "red"
use_os_path_sep = true

# --- Git ---------------------------------------------------------------------
# Branch is always shown (main included). A green  follows it when the working
# tree is clean; otherwise coloured counters spell out what is pending.

[git_branch]
format = " [$symbol$branch(:$remote_branch)]($style)"
symbol = " "
style = "bold purple"
truncation_length = 24
truncation_symbol = "…"
only_attached = true

[git_commit]
# Detached HEAD: show the short hash where the branch would be.
format = " [ $hash$tag]($style)"
style = "bold purple"

[git_state]
format = ' [$state( $progress_current/$progress_total)]($style)'
style = "bold yellow"

[custom.git_clean]
description = "Green check when the working tree has nothing to commit"
when = 'out=$(git status --porcelain 2>/dev/null) && [ -z "$out" ]'
shell = ["sh"]
symbol = ""
format = " [$symbol]($style)"
style = "bold green"

[git_status]
format = "([$conflicted$staged$modified$renamed$deleted$untracked$stashed$ahead_behind]($style))"
style = "bold"
conflicted = "[  $count](bold bright-red)"
staged     = "[  $count](bold green)"
modified   = "[  $count](bold yellow)"
renamed    = "[  $count](bold blue)"
deleted    = "[  $count](bold red)"
untracked  = "[  $count](bold cyan)"
stashed    = "[  $count](white)"
ahead      = "[  $count](bold green)"
behind     = "[  $count](bold red)"
diverged   = "[  $ahead_count  $behind_count](bold yellow)"
up_to_date = ""

[git_metrics]
disabled = false
format = '([ +$added]($added_style))([ -$deleted]($deleted_style))'
added_style = "green"
deleted_style = "red"
ignore_submodules = true

# --- Node.js ecosystem -------------------------------------------------------
# Node version turns red when package.json "engines.node" rejects the running
# version. The lockfile decides which package-manager badge appears, so you never
# `npm install` in a pnpm repo. Badges are detect-only: no process is spawned.

[nodejs]
format = " [$symbol$version]($style)"
symbol = " "
version_format = "${raw}"
style = "bold green"
not_capable_style = "bold red"
detect_files = [
  "package.json", ".nvmrc", ".node-version",
  "package-lock.json", "pnpm-lock.yaml", "yarn.lock",
  "!bun.lock", "!bun.lockb", "!bunfig.toml",
]
detect_folders = ["node_modules"]
detect_extensions = []

[bun]
# Bun projects (bun.lock / bunfig.toml) show bun instead of node.
format = " [$symbol$version]($style)"
symbol = " "
version_format = "${raw}"
style = "bold cyan"

[deno]
format = " [deno $version]($style)"
version_format = "${raw}"
style = "bold green"

[custom.pnpm]
description = "pnpm project"
detect_files = ["pnpm-lock.yaml"]
symbol = "󰏗 pnpm"
format = " [$symbol]($style)"
style = "bold cyan"

[custom.yarn]
description = "Yarn project"
detect_files = ["yarn.lock"]
symbol = " yarn"
format = " [$symbol]($style)"
style = "bold cyan"

[custom.npm]
description = "npm project"
detect_files = ["package-lock.json"]
symbol = " npm"
format = " [$symbol]($style)"
style = "bold cyan"

[package]
# Version from package.json (and Cargo.toml, pyproject.toml…). Private packages
# stay hidden — flip display_private if you want app versions too.
format = " [$symbol$version]($style)"
symbol = " "
version_format = "${raw}"
style = "purple"

# --- Other languages & clouds ------------------------------------------------

[python]
format = ' [${symbol}${version}( \($virtualenv\))]($style)'
symbol = " "
version_format = "${raw}"
style = "bold yellow"

[golang]
format = " [$symbol$version]($style)"
symbol = " "
version_format = "${raw}"
style = "bold cyan"

[rust]
format = " [$symbol$version]($style)"
symbol = " "
version_format = "${raw}"
style = "bold red"

[ruby]
format = " [$symbol$version]($style)"
symbol = " "
version_format = "${raw}"
style = "bold red"

[java]
format = " [$symbol$version]($style)"
symbol = " "
version_format = "${raw}"
style = "bold red"

[lua]
format = " [$symbol$version]($style)"
symbol = " "
version_format = "${raw}"
style = "bold blue"

[swift]
format = " [$symbol$version]($style)"
symbol = " "
version_format = "${raw}"
style = "bold bright-red"

[php]
format = " [$symbol$version]($style)"
symbol = " "
version_format = "${raw}"
style = "bold purple"

[kotlin]
format = " [$symbol$version]($style)"
symbol = " "
version_format = "${raw}"
style = "bold purple"

[dart]
format = " [$symbol$version]($style)"
symbol = " "
version_format = "${raw}"
style = "bold cyan"

[docker_context]
format = " [$symbol$context]($style)"
symbol = " "
style = "bold blue"

[terraform]
format = " [$symbol$workspace]($style)"
symbol = "󱁢 "
style = "bold purple"

[gcloud]
format = ' [$symbol$account(@$domain)(\($region\))]($style)'
symbol = "󱇶 "
style = "bold blue"

[aws]
disabled = true
format = " [$symbol$profile( $region)]($style)"
symbol = " "
style = "bold yellow"

# --- Status line: duration, exit code, battery, clock ------------------------

[cmd_duration]
min_time = 2000
format = " [ $duration]($style)"
style = "bold yellow"

[status]
disabled = false
format = " [$symbol$status]($style)"
symbol = " "
style = "bold red"
map_symbol = false

[battery]
format = " [$symbol $percentage]($style)"
full_symbol = "󰁹"
charging_symbol = "[󰂄](bold green)"
discharging_symbol = "󰁹"
unknown_symbol = "󰂑"
empty_symbol = "󰂎"

# Shown only below 70%; colour tracks the level.
[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 50
style = "bold yellow"

[[battery.display]]
threshold = 70
style = "green"

[time]
disabled = false
format = " [ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "white"

[jobs]
format = "[$symbol$number]($style) "
symbol = " "
style = "bold blue"
